name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Node dependencies
        run: npm ci
      - name: Install CAS reference dependencies
        run: |
          python -m venv services/cas-reference/.venv
          services/cas-reference/.venv/bin/python -m pip install -r services/cas-reference/requirements.lock
      - name: Check OpenSSL
        run: openssl version
      - name: Run SDK and protocol regression tests
        run: npm test
      - name: Audit SDK production dependencies
        run: npm audit --omit=dev --workspace=sso-browser-sdk-prototype --audit-level=low
      - name: Report full monorepo dependency audit
        run: |
          npm audit --json > "$RUNNER_TEMP/monorepo-audit.json" || true
          node - "$RUNNER_TEMP/monorepo-audit.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (report.error || !report.metadata?.vulnerabilities) {
            console.error('Full monorepo audit failed:', report.error?.summary ?? 'missing vulnerability totals');
            process.exitCode = 1;
          } else {
            const { low, moderate, high, critical, total } = report.metadata.vulnerabilities;
            console.log(`Full monorepo audit: ${total} findings (${high} high, ${moderate} moderate, ${low} low, ${critical} critical)`);
            console.log('Affected packages:', Object.keys(report.vulnerabilities ?? {}).join(', ') || 'none');
          }
          NODE
      - name: Inspect SDK package manifest
        run: npm pack --workspace=sso-browser-sdk-prototype --dry-run --json
